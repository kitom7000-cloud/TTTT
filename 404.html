<script>
/* ============================================================================
   ⚙️ منطق التطبيق
   ============================================================================ */
const STORE_KEY = 'rq-values-journey:v1';
const STAGES = ['بوابة القيمة', 'التقييم الذاتي القبلي', 'بطاقات التعرّف', 'القصة المصوّرة', 'لو كنت مكانهم', 'التقييم الذاتي البعدي', 'جواز القيمة'];
const STORY_LABELS = ['المشكلة', 'المبادرة', 'النتيجة'];
const CARD_DEFS = [
  { k: 'meaning', title: 'المعنى', icon: '📖' },
  { k: 'religion', title: 'من ديننا', icon: '🕌' },
  { k: 'behaviors', title: 'كيف تظهر فيّ؟', icon: '🙋' },
  { k: 'example', title: 'مثال من حياتي', icon: '🏫' }
];

function loadState() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const state = Object.assign({ traveler: null, passports: [], progress: {}, familyStamps: 0, last: null }, loadState());
const ui = { screen: 'landing', landing: 'passport', tab: 'values', valueId: null, flipped: false, wallFilter: 'all', wallSearch: '', celebrate: false, stampAnim: false };
if (state.traveler) {
  ui.screen = 'dashboard';
  if (state.last && state.last.tab) ui.tab = state.last.tab;
  if (state.last && state.last.screen === 'journey' && getValue(state.last.valueId)) { ui.screen = 'journey'; ui.valueId = state.last.valueId; }
}

/* ---------- أدوات مساعدة ---------- */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function getValue(id) { return APP_DATA.values.find(v => v.id === id); }
function rnd(n) { return Math.floor(Math.random() * n); }
function fmtDate(ts) {
  try { return new Date(ts).toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }); }
  catch (e) { return new Date(ts).toLocaleDateString(); }
}
function pk(vid) { return state.traveler.ticket + '|' + vid; }
function getProg(vid) {
  const k = pk(vid);
  if (!state.progress[k]) state.progress[k] = { stage: 0, pre: {}, post: {}, card: 0, seen: [], slide: 0, maxSlide: 0, sim: { choices: [], note: '' }, done: false };
  return state.progress[k];
}
function myPassport(vid) { return state.traveler && state.passports.find(p => p.ticket === state.traveler.ticket && p.valueId === vid); }
function stats() {
  const s = APP_DATA.seedStats;
  return {
    passports: s.passports + state.passports.length,
    wall: s.wall + state.passports.filter(p => p.onWall !== false).length,
    family: s.familyStamps + state.familyStamps
  };
}
function toast(msg) {
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div role="status" class="toast fixed bottom-6 left-1/2 z-[60] bg-ink text-cream px-5 py-3 rounded-2xl shadow-2xl text-sm font-semibold border border-gold2/40 max-w-[90vw] text-center">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => root.innerHTML = '', 2600);
}
function remember() { state.last = { screen: ui.screen, valueId: ui.valueId, tab: ui.tab }; save(); }
function go(screen, valueId) {
  ui.screen = screen; if (valueId !== undefined) ui.valueId = valueId;
  ui.flipped = false; remember(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

/* ---------- عناصر مشتركة ---------- */
function emblemSVG(size = 90) {
  const id = 'g' + size;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#B45309"/></linearGradient></defs>
    <g fill="none" stroke="url(#${id})" stroke-width="2.4">
      <circle cx="50" cy="50" r="27"/><ellipse cx="50" cy="50" rx="12" ry="27"/><path d="M23 50h54M27 37h46M27 63h46"/>
      <path d="M18 72 C 8 58, 8 38, 20 24" stroke-linecap="round"/><path d="M82 72 C 92 58, 92 38, 80 24" stroke-linecap="round"/>
    </g>
    <g fill="url(#${id})">
      ${[0,1,2,3,4].map(i => `<ellipse cx="${15 - i*0.6}" cy="${66 - i*9}" rx="3.2" ry="6" transform="rotate(${-30 + i*10} ${15 - i*0.6} ${66 - i*9})"/><ellipse cx="${85 + i*0.6}" cy="${66 - i*9}" rx="3.2" ry="6" transform="rotate(${30 - i*10} ${85 + i*0.6} ${66 - i*9})"/>`).join('')}
      <path d="M50 8 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9-3.1 -5.9 3.1 1.1-6.4 -4.7-4.6 6.5-1z"/>
    </g>
  </svg>`;
}

function flightBoard() {
  const f = APP_DATA.flight;
  const cell = (k, v) => `<div class="flex items-center gap-2 shrink-0"><span class="text-[11px] sm:text-xs text-amber-200/60">${k}</span><span class="flap text-amber-300 font-bold text-xs sm:text-sm">${v}</span></div>`;
  return `<div class="board border-b border-gold2/30 no-print">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-4 sm:gap-6 overflow-x-auto scrollbar-none">
      <div class="flex items-center gap-2 shrink-0 text-amber-300"><span class="text-lg">✈</span><span class="font-extrabold text-xs sm:text-sm">المغادرة</span></div>
      ${cell('رقم الرحلة', esc(f.number))}

      ${cell('البوابة', esc(state.traveler ? state.traveler.gate : f.gate))}

    </div>
  </div>`;
}

function footer() {
  return `<footer class="no-print border-t border-royal/10 mt-10">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-royal/70">
      <div class="text-center sm:text-start"><span class="font-bold text-royal">${esc(APP_DATA.school.name)}</span> · ${esc(APP_DATA.school.subtitle)}</div>
      <div class="text-center">${esc(APP_DATA.supervisorTitle)}: ${APP_DATA.supervisors.map(esc).join(' · ')}</div>
      <button onclick="resetAll()" class="text-xs text-royal/40 hover:text-red-700 hover:underline underline-offset-4">إعادة ضبط البيانات</button>
    </div>
  </footer>`;
}

function boardingPass(t, notchBg) {
  const f = APP_DATA.flight;
  const field = (k, v, cls = '') => `<div><div class="text-[11px] text-royal/55 font-semibold">${k}</div><div class="font-extrabold text-royal ${cls}">${v}</div></div>`;
  return `<div class="ticket-in w-full max-w-2xl mx-auto">
    <div class="relative flex flex-col sm:flex-row rounded-3xl overflow-hidden bg-cream shadow-[0_30px_70px_-20px_rgba(0,0,0,.6)] ring-1 ring-gold2/40">

            <div><div class="font-black text-royal leading-tight">بطاقة صعود الطائرة</div><div class="text-[11px] tracking-[.2em] text-gold font-bold" dir="ltr">BOARDING PASS</div></div></div>

function openPassport() {
  const w = document.getElementById('passportWrap');
  if (!w || w.classList.contains('opening')) return;
  w.classList.add('opening'); w.classList.remove('passport-glow');
  setTimeout(() => { ui.landing = 'form'; render(); setTimeout(() => { const i = document.getElementById('nameInput'); i && i.focus(); }, 50); }, 850);
}
function submitName(e) {
  e.preventDefault();
  const name = document.getElementById('nameInput').value.replace(/\s+/g, ' ').trim();
  const err = document.getElementById('nameErr');
  if (name.length < 2) { err.textContent = 'فضلاً اكتبي اسمك أولاً.'; return; }
  const rows = ['1', '2', '3', '4'], seats = ['A', 'B', 'E', 'F'];
  state.traveler = {
    name, ticket: 'BP' + String(100000 + rnd(900000)),
    gate: APP_DATA.flight.gate, seat: rows[rnd(4)] + seats[rnd(4)],
    seatClass: APP_DATA.flight.seatClass, issuedAt: Date.now()
  };
  ui.landing = 'ticket'; state.last = null; save(); render();
}
function newTraveler() {
  if (!confirm('سيتم تسجيل خروج المسافر الحالي (تبقى جوازاته في الجدارية). متابعة؟')) return;
  state.traveler = null; state.last = null; save();
  closeModal(); ui.screen = 'landing'; ui.landing = 'passport'; render(); window.scrollTo(0, 0);
}
function resetAll() {
  if (!confirm('سيتم حذف جميع البيانات المحفوظة على هذا الجهاز (المسافرون، الجوازات، الجدارية، الأختام). هل أنت متأكد؟')) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  location.reload();
}

function setStage(n) {
  const p = getProg(ui.valueId); p.stage = n; ui.flipped = false; save(); render();

}

/* 2 و 6) التقييم الذاتي */
function stageAssess(kind) {
  return (v, p) => {
    const ans = p[kind];
    const isPost = kind === 'post';
    const complete = Object.keys(ans).length === v.assessment.length;
    let compare = '';
    if (isPost && complete) {
      const avg = o => Object.values(o).reduce((a, b) => a + b, 0) / v.assessment.length;
      const a = avg(p.pre), b = avg(p.post);
      compare = `<div class="mt-6 p-5 rounded-3xl bg-gradient-to-l from-royal to-royal2 text-cream fade-up">
        <div class="font-black mb-3">📊 مقارنة تقييمك</div>
        <div class="grid grid-cols-2 gap-4 text-center">
          <div><div class="text-xs text-cream/70">قبل الرحلة</div><div class="text-3xl font-black">${a.toFixed(1)}<span class="text-sm">/4</span></div></div>
          <div><div class="text-xs text-cream/70">بعد الرحلة</div><div class="text-3xl font-black gold-text">${b.toFixed(1)}<span class="text-sm">/4</span></div></div>
        </div>
        <p class="text-sm text-center mt-3 text-amber-100">${b > a ? 'رائع! عزمك على هذه القيمة صار أقوى 🌟' : b === a ? 'ثابت على الخير — استمر وطبّق ما تعلمته 💪' : 'الصدق مع النفس بداية التغيير، والطريق ما زال أمامك 🌱'}</p>
      </div>`;
    }
    return `<div class="fade-up">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">${isPost ? '🛬' : '🛫'}</div>
        <h2 class="text-2xl sm:text-3xl font-black text-royal">التقييم الذاتي ${isPost ? 'بعد الرحلة' : 'قبل الرحلة'}</h2>
        <p class="text-royal/60 mt-1">${isPost ? 'بعد ما تعلمته، كيف ستتعامل مع هذه السلوكيات؟' : 'كن صادقاً مع نفسك، لا توجد إجابة خاطئة!'}</p>
      </div>
      <div class="space-y-4">
        ${v.assessment.map((q, qi) => `
          <div class="bg-white rounded-3xl p-5 ring-1 ring-royal/10 shadow-sm">
            <div class="flex gap-3 items-start mb-4"><span class="w-8 h-8 rounded-full bg-royal text-cream grid place-items-center font-black text-sm shrink-0">${qi + 1}</span><p class="font-bold text-royal text-lg leading-relaxed">${esc(q)}</p></div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" role="radiogroup">
              ${APP_DATA.ratingScale.map(r => {
                const on = ans[qi] === r.score;
                return `<button role="radio" aria-checked="${on}" onclick="rate('${kind}',${qi},${r.score})" class="py-3 rounded-2xl border-2 font-bold transition flex flex-col items-center gap-1 ${on ? 'border-gold bg-amber-50 text-royal shadow-[0_0_0_3px_rgba(245,158,11,.25)] scale-[1.03]' : 'border-royal/10 text-royal/70 hover:border-gold2/60 bg-cream/50'}">
                  <span class="text-2xl sm:text-3xl">${r.emoji}</span><span class="text-sm">${r.label}</span></button>`;
              }).join('')}
            </div>
          </div>`).join('')}
      </div>
      ${compare}
      ${navButtons(isPost ? 4 : 0, `nextAssess('${kind}')`, isPost ? 'استلم جوازك 🛂' : 'التالي', complete)}
    </div>`;
  };
}
function rate(kind, qi, score) { const p = getProg(ui.valueId); p[kind][qi] = score; save(); keepScroll(render); }
function nextAssess(kind) {
  const v = getValue(ui.valueId), p = getProg(v.id);
  if (Object.keys(p[kind]).length < v.assessment.length) return toast('أجب عن جميع الأسئلة أولاً ✋');
  if (kind === 'pre') setStage(2); else completeJourney();
}

function flipCard() {

  document.getElementById('seenCount').textContent = `قلبت ${n} من 4`;
  if (n === 4) document.getElementById('nextBtn').classList.remove('opacity-50');

function cardGo(j) { if (j < 0 || j > 3) return; const p = getProg(ui.valueId); p.card = j; ui.flipped = false; save(); keepScroll(render); }
function nextCards() {

  const tones = ['from-slate-200 to-stone-300', 'from-amber-100 to-amber-200', 'from-emerald-100 to-sky-100'];
  const img = s.scene ? sceneSVG(s.scene) : s.image ? `<img src="${esc(s.image)}" alt="${esc(s.title)}" class="w-full h-full object-cover">` :
    `<div class="w-full h-full bg-gradient-to-br ${tones[i % 3]} grid place-items-center relative overflow-hidden"><div class="absolute w-64 h-64 rounded-full bg-white/40 -top-16 -left-10"></div><div class="absolute w-40 h-40 rounded-full bg-white/30 bottom-0 right-6"></div><span class="relative text-[110px] sm:text-[140px] drop-shadow-xl">${s.emoji || '📖'}</span></div>`;
  const labelColors = ['bg-slate-700', 'bg-gold', 'bg-emerald-700'];
  return `<div class="fade-up">
    <div class="text-center mb-6"><h2 class="text-2xl sm:text-3xl font-black text-royal">القصة التفاعلية المصوّرة</h2><p class="text-royal/60 mt-1">تابع أحداث القصة شريحةً بشريحة</p></div>
    <article class="bg-white rounded-3xl overflow-hidden ring-1 ring-royal/10 shadow-xl max-w-2xl mx-auto">
      <div class="relative aspect-[5/3] fade-in">${img}
        <span class="absolute top-4 right-4 px-3 py-1 rounded-full ${labelColors[i % 3]} text-white text-sm font-extrabold shadow">${i + 1}. ${STORY_LABELS[i] || ''}</span></div>
      <div class="p-5 sm:p-7 fade-up">
        <h3 class="text-xl sm:text-2xl font-black text-royal">${esc(s.title)}</h3>
        <p class="mt-3 text-lg leading-loose text-royal/80">${esc(s.text)}</p>
      </div>
      <div class="flex items-center justify-between px-5 sm:px-7 pb-6">
        <button onclick="slideGo(${i - 1})" ${i === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl bg-cream text-royal font-bold disabled:opacity-30">→ السابقة</button>
        <div class="flex gap-1.5">${slides.map((_, j) => `<button onclick="slideGo(${j})" aria-label="شريحة ${j + 1}" class="h-2.5 rounded-full transition-all ${j === i ? 'w-7 bg-gold2' : 'w-2.5 bg-royal/20'}"></button>`).join('')}</div>
        <button onclick="slideGo(${i + 1})" ${i === slides.length - 1 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl bg-royal text-cream font-bold disabled:opacity-30">التالية ←</button>
      </div>
    </article>
    ${navButtons(2, 'nextStory()', 'لو كنت مكانهم...', (p.maxSlide || 0) >= slides.length - 1)}
  </div>`;
}
function slideGo(j) {
  const v = getValue(ui.valueId), p = getProg(v.id);
  if (j < 0 || j >= v.story.length) return;
  p.slide = j; p.maxSlide = Math.max(p.maxSlide || 0, j); save(); keepScroll(render);
}
function nextStory() {
  const v = getValue(ui.valueId), p = getProg(v.id);
  if (v.story && v.story.length && (p.maxSlide || 0) < v.story.length - 1) return toast('تابع القصة حتى الشريحة الأخيرة 📖');
  setStage(4);
}

/* 5) سؤال المحاكاة */
function stageSim(v, p) {
  const s = v.simulation;
  return `<div class="fade-up">
    <div class="text-center mb-6"><div class="text-4xl mb-2">🤔</div><h2 class="text-2xl sm:text-3xl font-black text-royal leading-snug">${esc(s.question)}</h2><p class="text-royal/60 mt-1">يمكنك اختيار أكثر من إجابة</p></div>
    <div class="grid sm:grid-cols-2 gap-3">
      ${s.options.map((o, i) => `
        <label class="opt cursor-pointer flex items-center gap-3 p-4 rounded-2xl bg-white border-2 border-royal/10 hover:border-gold2/60 transition">
          <input type="checkbox" class="sr-only" ${p.sim.choices.includes(i) ? 'checked' : ''} onchange="toggleSim(${i}, this.checked)">
          <span class="tick w-7 h-7 shrink-0 rounded-lg border-2 border-royal/25 grid place-items-center text-sm font-black text-transparent transition">✓</span>
          <span class="font-bold text-royal leading-relaxed">${esc(o)}</span>
        </label>`).join('')}
    </div>
    <div class="mt-6 bg-white rounded-3xl p-5 ring-1 ring-royal/10">
      <label for="simNote" class="font-black text-royal flex flex-wrap items-center gap-2">💡 مبادرتي الشخصية <span class="text-xs font-semibold text-royal/50">(اختياري — ستظهر في الجدارية)</span></label>
      <textarea id="simNote" rows="3" maxlength="200" oninput="getProg(ui.valueId).sim.note=this.value;save();document.getElementById('noteLen').textContent=this.value.length" placeholder="اكتب فكرة مبادرة تودّ تنفيذها..." class="mt-3 w-full rounded-2xl border-2 border-royal/10 focus:border-gold2 outline-none p-3 bg-cream/50 resize-none">${esc(p.sim.note)}</textarea>
      <div class="text-left text-xs text-royal/40"><span id="noteLen">${p.sim.note.length}</span>/200</div>
    </div>
    ${navButtons(3, 'nextSim()', 'التالي', true)}
  </div>`;
}
function toggleSim(i, on) {
  const p = getProg(ui.valueId);
  p.sim.choices = p.sim.choices.filter(x => x !== i); if (on) p.sim.choices.push(i); save();
}
function nextSim() { if (!getProg(ui.valueId).sim.choices.length) return toast('اختر إجابة واحدة على الأقل ☑️'); setStage(5); }

/* 7) نهاية الرحلة وإصدار الجواز */
function completeJourney() {
  const v = getValue(ui.valueId), p = getProg(v.id), t = state.traveler;
  let pp = myPassport(v.id);
  if (!pp) {
    const seq = state.passports.length + 1;
    pp = { number: `${APP_DATA.flight.number}-${String(seq).padStart(4, '0')}`, ticket: t.ticket, name: t.name, valueId: v.id, date: Date.now(), note: (p.sim.note || '').trim(), family: null, onWall: true };
    state.passports.push(pp);
    ui.celebrate = true;
  } else {
    pp.note = (p.sim.note || '').trim() || pp.note;
  }
  p.done = true; setStage(6);
}
function stagePassport(v, p) {
  const pp = myPassport(v.id);
  if (!pp) return `<div class="text-center py-16"><p class="font-bold text-royal">لم يكتمل الجواز بعد.</p><button onclick="setStage(5)" class="gold-btn text-white font-bold px-6 py-3 rounded-2xl mt-4">العودة للتقييم</button></div>`;
  const choices = p.sim.choices.map(i => v.simulation.options[i]).filter(Boolean);
  const familyStamp = pp.family ? `
    <div class="${ui.stampAnim ? 'stamp-in' : 'stamp'} w-24 h-24 sm:w-28 sm:h-28 rounded-full border-4 border-double border-emerald-700/80 text-emerald-800 grid place-items-center text-center bg-emerald-50/70 shrink-0">
      <div><div class="text-xl">🏠</div><div class="text-[11px] font-black leading-tight">ختم الأسرة</div><div class="text-[10px] font-bold max-w-[80px] truncate mx-auto">${esc(pp.family.name)}</div></div></div>` : '';
  return `<div class="fade-up">
    <div class="text-center mb-6 no-print">
      <div class="text-5xl mb-2">🎉</div>
      <h2 class="text-3xl sm:text-4xl font-black text-royal">مبروك! وصلت إلى وجهتك</h2>
      <p class="text-royal/60 mt-1">تم إصدار جواز القيمة الرسمي وإضافة اسمك إلى جدارية القيم</p>
    </div>

    <div id="printable" class="relative max-w-2xl mx-auto rounded-[28px] overflow-hidden shadow-[0_40px_80px_-30px_rgba(2,44,34,.7)] ring-2 ring-gold2/60">
      <div class="bg-royal px-5 sm:px-6 py-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">${emblemSVG(46)}<div><div class="gold-text font-black text-lg sm:text-xl leading-tight">جواز القيمة الرسمي</div><div class="text-[10px] tracking-[.3em] text-amber-300/70" dir="ltr">VALUE PASSPORT</div></div></div>
        <div class="text-left"><div class="text-[10px] text-amber-200/70">رقم الجواز</div><div class="font-black text-gold2 tracking-wider text-sm sm:text-base" dir="ltr">${esc(pp.number)}</div></div>
      </div>
      <div class="bg-cream guilloche p-5 sm:p-8">
        <div class="flex flex-col sm:flex-row gap-6">
          <div class="w-28 h-32 shrink-0 rounded-2xl grid place-items-center text-6xl ring-4 ring-white shadow-lg mx-auto sm:mx-0" style="background: linear-gradient(160deg, ${v.color}, #022C22)">${v.icon}</div>
          <div class="flex-1 grid grid-cols-2 gap-x-4 gap-y-3 text-sm">
            <div class="col-span-2"><div class="text-[11px] text-royal/50 font-semibold">اسم حامل الجواز</div><div class="font-black text-royal text-xl sm:text-2xl">${esc(pp.name)}</div></div>
            <div><div class="text-[11px] text-royal/50 font-semibold">القيمة المُنجزة</div><div class="font-extrabold" style="color:${v.color}">${esc(v.title)}</div></div>
            <div><div class="text-[11px] text-royal/50 font-semibold">تاريخ الإصدار</div><div class="font-extrabold text-royal">${fmtDate(pp.date)}</div></div>
            <div><div class="text-[11px] text-royal/50 font-semibold">جهة الإصدار</div><div class="font-extrabold text-royal">${esc(APP_DATA.school.name)}</div></div>
            <div><div class="text-[11px] text-royal/50 font-semibold">رقم الرحلة</div><div class="font-extrabold text-royal" dir="ltr">${esc(APP_DATA.flight.number)}</div></div>
          </div>
        </div>
        ${choices.length ? `<div class="mt-6 pt-5 border-t-2 border-dashed border-royal/15"><div class="text-[11px] text-royal/50 font-semibold mb-2">التزاماتي في هذه القيمة</div><ul class="space-y-1.5 text-sm font-semibold text-royal">${choices.map(c => `<li class="flex gap-2"><span class="text-gold">✦</span>${esc(c)}</li>`).join('')}</ul>${pp.note ? `<p class="mt-3 text-sm bg-white rounded-xl px-3 py-2 border-r-4 border-gold2">💡 ${esc(pp.note)}</p>` : ''}</div>` : ''}
        <div class="mt-6 pt-5 border-t-2 border-dashed border-royal/15 flex items-end justify-between gap-4">
          <div class="text-[11px] text-royal/60"><div class="font-semibold">توقيع ${esc(APP_DATA.supervisorTitle)}</div><div class="font-black text-royal text-sm mt-1 italic">${esc(APP_DATA.supervisors[0] || '')}</div></div>
          <div class="flex items-end gap-3">
            ${familyStamp}
            <div class="stamp w-20 h-20 sm:w-24 sm:h-24 rounded-full border-4 border-double border-gold/70 text-gold grid place-items-center shrink-0"><div class="text-center text-[11px] font-black leading-tight">✈<br>تمّت<br>الرحلة</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="max-w-2xl mx-auto mt-6 bg-white rounded-3xl p-5 sm:p-6 ring-1 ring-royal/10 no-print">
      ${pp.family ? `<div class="flex items-center gap-3"><span class="text-3xl">🏠</span><div><div class="font-black text-royal">تم ختم جوازك من الأسرة</div><div class="text-sm text-royal/60">شكراً لـ ${esc(pp.family.name)} على المشاركة 💚</div></div></div>` : `
        <div class="font-black text-royal flex items-center gap-2">🏠 ختم الأسرة</div>
        <p class="text-sm text-royal/60 mt-1">اعرض جوازك على أحد أفراد أسرتك، ثم يكتب اسمه ويضغط «اختم الجواز».</p>
        <div class="flex flex-col sm:flex-row gap-3 mt-3">
          <input id="famName" maxlength="40" placeholder="اسم ولي الأمر / فرد الأسرة" class="flex-1 rounded-2xl border-2 border-royal/10 focus:border-gold2 outline-none px-4 py-3 bg-cream/50" onkeydown="if(event.key==='Enter')addFamilyStamp()">
          <button onclick="addFamilyStamp()" class="px-6 py-3 rounded-2xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold">اختم الجواز 🔏</button>
        </div>`}
    </div>

    <div class="flex flex-wrap justify-center gap-3 mt-8 no-print">
      <button onclick="ui.tab='wall';go('dashboard')" class="gold-btn text-white font-extrabold px-6 py-3.5 rounded-2xl">🖼️ شاهد الجدارية</button>
      <button onclick="ui.tab='values';go('dashboard')" class="px-6 py-3.5 rounded-2xl bg-royal text-cream font-extrabold">🧭 قيمة جديدة</button>
      <button onclick="window.print()" class="px-6 py-3.5 rounded-2xl border-2 border-royal/15 text-royal font-extrabold hover:bg-royal/5">🖨️ طباعة الجواز</button>
      <button onclick="restartValue()" class="px-6 py-3.5 rounded-2xl text-royal/60 font-bold hover:text-royal">↺ إعادة الرحلة</button>
    </div>
  </div>`;
}
function addFamilyStamp() {
  const name = document.getElementById('famName').value.replace(/\s+/g, ' ').trim();
  if (name.length < 2) return toast('اكتب اسم فرد الأسرة أولاً ✍️');
  const pp = myPassport(ui.valueId); if (!pp || pp.family) return;
  pp.family = { name, date: Date.now() }; state.familyStamps++; save();
  ui.stampAnim = true; keepScroll(render); ui.stampAnim = false;
  toast('تم ختم الجواز من الأسرة 🏠✨');
}
function restartValue() {
  if (!confirm('ستبدأ رحلة هذه القيمة من جديد (يبقى جوازك محفوظاً). متابعة؟')) return;
  delete state.progress[pk(ui.valueId)]; getProg(ui.valueId); setStage(0);
}

/* ============================================================================
   العرض
   ============================================================================ */
function animateCounts() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, dur = 1200, t0 = performance.now();
    if (!to) { el.textContent = '0'; return; }
    const step = now => { const k = Math.min(1, (now - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function celebrate() {
  if (typeof confetti !== 'function') return;
  const colors = ['#F59E0B', '#D97706', '#064E3B', '#10B981', '#FDE68A'];
  confetti({ particleCount: 140, spread: 90, origin: { y: .6 }, colors });
  setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 70, origin: { x: 0 }, colors }), 250);
  setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 70, origin: { x: 1 }, colors }), 400);
}
function render() {
  const app = document.getElementById('app');
  if (!state.traveler && ui.screen !== 'landing') { ui.screen = 'landing'; ui.landing = 'passport'; }
  if (ui.screen === 'landing') app.innerHTML = renderLanding();
  else if (ui.screen === 'journey') app.innerHTML = renderJourney();
  else app.innerHTML = renderDashboard();
  animateCounts();
  if (ui.celebrate) { ui.celebrate = false; setTimeout(celebrate, 250); }
}
// مزامنة تلقائية للأرقام والجدارية إذا فُتح التطبيق في أكثر من تبويب
window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY) return;
  const fresh = loadState();
  state.passports = fresh.passports || []; state.familyStamps = fresh.familyStamps || 0;
  if (ui.screen === 'dashboard') keepScroll(render);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
render();
</script>
</body>
</html>
